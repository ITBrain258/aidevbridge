<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App-Icon: Eingabeaufforderung (Chevron und Unterstrich) in Tinte auf
       der Akzentflaeche des Standardthemas. Bewusst schriftfrei, damit der
       Rasterizer keine Schrift aufloesen muss, und geometrisch identisch
       zum Terminal-Zeichen im leeren Rasterzustand. Farben: ab-accent
       #2DD4BF und ab-accent-ink #0F172A aus dem Tuerkis-Thema; Radius
       307 = 30 Prozent, dasselbe Verhaeltnis wie das Logozeichen im
       Erststart (12 auf 40). Quelle fuer `npm run tauri icon`. -->
  <rect width="1024" height="1024" rx="307" ry="307" fill="#2DD4BF"/>
  <g fill="none" stroke="#0F172A" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="341,363 469,491 341,619"/>
    <line x1="512" y1="661" x2="683" y2="661"/>
  </g>
</svg>
