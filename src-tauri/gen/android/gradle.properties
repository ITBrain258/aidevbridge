# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# From the Tauri 2.12 template for the Android Gradle plugin 9: AndroidX and
# non-transitive R classes are its defaults now. Tauri's older plugin
# template left out consumer-rules.pro (tauri-apps/tauri#15828), and the
# build keeps the plugin's own Kotlin integration and the old DSL until
# Tauri v3.
android.proguard.failOnMissingFiles=false
android.builtInKotlin=false
android.newDsl=false

# Dependency downloads: Gradle tries a failed request (504, timeout) three
# times in all by default, waiting 1 s and then twice as long each time;
# answers 429 and 504 behind Maven Central failed CI builds that way
# (2026-11-06 and 2026-11-08). Five tries starting at 2 s, and 60 s per
# connection and read (default 30 s).
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=2000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
