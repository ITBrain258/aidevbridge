# Gradle 9.6 und das Android-Gradle-Plugin 9.3 laufen auf Java 21; das Java 25,
# das Android Studio ab 2026.2 mitbringt, ist nicht getestet (Spec 2026-10-27
# §4.1). Gradle und Android Studio waehlen damit ein JDK 21, etwa
# aus ~/.jdks; fehlt es, bietet Android Studio den Download an.
toolchainVersion=21
