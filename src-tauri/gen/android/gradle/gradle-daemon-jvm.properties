# Gradle 8.14 und das Android-Gradle-Plugin 8.11 laufen auf Java 17 bis 21,
# nicht auf dem Java 25, das Android Studio ab 2026.2 mitbringt (Spec
# 2026-10-27 §4.1). Gradle und Android Studio waehlen damit ein JDK 21, etwa
# aus ~/.jdks; fehlt es, bietet Android Studio den Download an.
toolchainVersion=21
