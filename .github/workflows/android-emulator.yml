name: Android emulator
# Starts the app in the Android emulator (Android 17, x86_64) and keeps the
# system log: a crash at start shows up here without a phone at the PC. The
# build is a release build like the published one (R8 included), signed with
# a throwaway key made in this job; nothing leaves the job but the logs.
#
# Diagnosis of the crash at start on target SDK 37: the job builds the
# branch as it is and a second time without registering the local network
# plugin (lib.rs), and starts both.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true
env:
  NDK_VERSION: 29.0.14206865
  BUILD_TOOLS: 36.0.0
  PACKAGE_NAME: io.github.itbrain258.aidevbridge
  SYSTEM_IMAGE: system-images;android-37.0;google_apis;x86_64
jobs:
  start:
    name: Start on Android 17 (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          targets: x86_64-linux-android
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Android SDK, NDK, emulator and Java 21
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION" emulator platform-tools "$SYSTEM_IMAGE" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      # The runner has KVM; the emulator needs access to /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci
      - name: Build for x86_64, with and without the plugin
        run: |
          set -euo pipefail
          assets=src-tauri/gen/android/app/src/main/assets/licenses
          mkdir -p "$assets"
          printf 'aidevbridge emulator check of commit %s. Not for distribution.\n' "$GITHUB_SHA" > "$assets/README.txt"
          keytool -genkeypair -keystore "$RUNNER_TEMP/check.jks" -storepass checkcheck -keypass checkcheck \
            -alias check -keyalg RSA -keysize 2048 -validity 2 -dname CN=emulator-check
          unsigned=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          sign() {
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/check.jks" \
              --ks-pass pass:checkcheck --out "$1" "$unsigned"
          }
          npm run tauri -- android build --ci --apk --target x86_64
          sign "$RUNNER_TEMP/app.apk"
          grep -q 'builder.plugin(local_network::init())' src-tauri/src/lib.rs
          sed -i 's/builder.plugin(local_network::init())/builder/' src-tauri/src/lib.rs
          npm run tauri -- android build --ci --apk --target x86_64
          sign "$RUNNER_TEMP/app-without-plugin.apk"
          git checkout -- src-tauri/src/lib.rs
      - name: Start the app
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          # avdmanager and the emulator look for AVDs in different places
          # unless both are told.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n check -k "$SYSTEM_IMAGE" > /dev/null
          "$ANDROID_HOME/emulator/emulator" -avd check -no-window -no-audio -no-boot-anim -no-snapshot \
            -accel on -cores 4 -memory 4096 -partition-size 8192 \
            -gpu swiftshader_indirect -camera-back none -camera-front none \
            > "$RUNNER_TEMP/emulator.txt" 2>&1 &
          timeout 300 "$adb" wait-for-device
          for i in $(seq 1 120); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            sleep 10
          done
          [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] || { echo "::error::no boot in 20 minutes"; exit 1; }
          echo "Android $("$adb" shell getprop ro.build.version.release | tr -d '\r'), API $("$adb" shell getprop ro.build.version.sdk | tr -d '\r')"
          # Right after the boot the package service may still restart;
          # installs then fail with "Can't find service: package".
          ready() {
            for _ in $(seq 1 60); do
              timeout 60 "$adb" wait-for-device || true
              "$adb" shell pm path android 2>/dev/null | grep -q package: && return 0
              sleep 5
            done
            return 1
          }
          install() {
            for attempt in 1 2 3 4 5; do
              ready && "$adb" install -r "$1" && return 0
              echo "install attempt $attempt failed"
              sleep 15
            done
            return 1
          }
          # Starts one APK and keeps its log; prints whether it still runs.
          check() {
            local name=$1 apk=$2
            echo "=== $name ==="
            install "$apk" || { echo "::error::$name: not installed"; return 1; }
            "$adb" logcat -c || true
            "$adb" shell am start -W -n "$PACKAGE_NAME/.MainActivity" || true
            sleep 40
            "$adb" logcat -d > "$RUNNER_TEMP/logcat-$name.txt" || true
            grep -E "AndroidRuntime|FATAL|Fatal signal|Abort message|panicked|RustStdoutStderr|Tauri|wry|libaidevbridge|$PACKAGE_NAME" \
              "$RUNNER_TEMP/logcat-$name.txt" | grep -v "surfaceflinger" | head -150 || true
            if "$adb" shell pidof "$PACKAGE_NAME" > /dev/null; then
              echo "RESULT $name: running 40 s after its start"
            else
              echo "RESULT $name: NOT running 40 s after its start"
            fi
            "$adb" shell am force-stop "$PACKAGE_NAME" || true
          }
          sleep 30
          ready || { echo "::error::The package service did not come up"; exit 1; }
          "$adb" shell wm dismiss-keyguard || true
          check with-plugin "$RUNNER_TEMP/app.apk" || true
          check without-plugin "$RUNNER_TEMP/app-without-plugin.apk" || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-log
          path: |
            ${{ runner.temp }}/logcat-*.txt
            ${{ runner.temp }}/emulator.txt
          if-no-files-found: ignore
