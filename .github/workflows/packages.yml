name: Packages
# Builds the installers and installs and starts each one on a fresh runner.
# Every push and pull request makes a preview of the macOS disk image (no
# license texts, never published). A tag v*, a manual run with "release" or a
# manual run naming a tag makes the release builds for Windows (setup EXE, MSI,
# ZIP) and macOS (universal DMG), which need the bound license selections. On a
# tag, or a manual run naming one, the packages go to the GitHub release of
# that tag; the release is created if there is none yet.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release build of this branch (checks the bound license selections; publishes nothing)
        type: boolean
        default: false
      tag:
        description: Build the existing tag v<version> and attach the packages its release still lacks
        type: string
        default: ''
permissions:
  contents: read
# A manual run naming a tag shares the group of that tag's push, so that the
# two never attach to the same release at the same time.
concurrency:
  group: packages-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.tag }}
env:
  # The source to build: the named tag of a manual run, otherwise the event's
  # commit. github.sha rather than the ref name, so that the build is the
  # commit the provenance records even if the tag or branch moves during the
  # run. A named tag is fully qualified, so that checkout does not take a
  # branch of the same name first; every job that uses it checks it before
  # checkout and build.
  SOURCE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
  # The tag whose release receives the packages; empty for previews and test runs.
  PUBLISH_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true || (inputs.tag || '') != '' }}
jobs:
  macos-package:
    name: Build macOS DMG
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      dmg: ${{ steps.artifact.outputs.dmg }}
      signing: ${{ steps.artifact.outputs.signing }}
    steps:
      - name: Check the named tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The named tag must have the form v<major>.<minor>.<patch>"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.SOURCE_REF }}', persist-credentials: false }
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Tag and version agree
        if: env.PUBLISH_TAG != ''
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$PUBLISH_TAG" != "v$version" ]; then
            echo "::error::Tag $PUBLISH_TAG does not match package.json version $version"
            exit 1
          fi
      - name: Build and check the disk image
        env:
          # Developer ID signing and notarization only for a published build and
          # only with complete secrets; otherwise the build is signed ad-hoc.
          APPLE_CERTIFICATE: ${{ env.PUBLISH_TAG != '' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.PUBLISH_TAG != '' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ env.PUBLISH_TAG != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ env.PUBLISH_TAG != '' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ env.PUBLISH_TAG != '' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_P8: ${{ env.PUBLISH_TAG != '' && secrets.APPLE_API_KEY_P8 || '' }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          fi
          unset APPLE_API_KEY_P8
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          if [ "$RELEASE" = true ]; then npm run build:macos; else npm run build:macos -- --preview; fi
      - name: Collect the disk image
        id: artifact
        run: |
          set -euo pipefail
          run=$(ls -d out/release-macos/*/ | tail -n 1)
          mkdir dmg
          cp "$run"artifacts/*.dmg "$run"artifacts/release-manifest.json dmg/
          cd dmg
          dmg=$(ls *.dmg)
          node -e '
            const fs = require("fs"), [file] = process.argv.slice(1);
            const manifest = JSON.parse(fs.readFileSync("release-manifest.json"));
            const item = manifest.artifacts.find(a => a.path === file);
            fs.writeFileSync(`${file}.sha256`, `${item.sha256}  ${file}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `signing=${manifest.contract.signing.mode}\n`);
          ' "$dmg"
          shasum -a 256 -c "$dmg.sha256"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "### $dmg" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(cat "$dmg.sha256")\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg
          path: dmg/
          if-no-files-found: error
      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-build-logs
          path: |
            out/release-macos/*/*.json
            out/release-macos/*/logs/
          if-no-files-found: ignore

  macos-install:
    name: Install and start on macOS (${{ matrix.arch }})
    needs: macos-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      APP: /Applications/aidevbridge.app
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: macos-dmg }
      - name: Install from the disk image
        env:
          ARCH: ${{ matrix.arch }}
          DMG: ${{ needs.macos-package.outputs.dmg }}
          SIGNING: ${{ needs.macos-package.outputs.signing }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$ARCH"
          dmg="$DMG"
          shasum -a 256 -c "$dmg.sha256"
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mount" "$dmg"
          ls -la "$mount"
          ditto "$mount/aidevbridge.app" "$APP"
          hdiutil detach "$mount"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/aidevbridge"
          if ! spctl --assess --type execute --verbose=2 "$APP"; then
            if [ "$SIGNING" = developer-id ]; then
              echo "::error::Gatekeeper rejects the notarized app"
              exit 1
            fi
            echo "Gatekeeper rejects the ad-hoc signed app, as expected without notarization."
          fi
      - name: Start the app and find its window
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/aidevbridge.log"
          "$APP/Contents/MacOS/aidevbridge" > "$log" 2>&1 &
          pid=$!
          cat > "$RUNNER_TEMP/windows.swift" <<'SWIFT'
          import CoreGraphics
          import Foundation
          let pid = Int32(CommandLine.arguments[1])!
          let all = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]] ?? []
          let mine = all.filter { ($0[kCGWindowOwnerPID as String] as? Int32) == pid && ($0[kCGWindowLayer as String] as? Int) == 0 }
          for window in mine { print(window[kCGWindowBounds as String] ?? "") }
          exit(mine.isEmpty ? 1 : 0)
          SWIFT
          swiftc -O -o "$RUNNER_TEMP/windows" "$RUNNER_TEMP/windows.swift"
          found=false
          for attempt in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              echo "::error::aidevbridge exited during start"
              exit 1
            fi
            if "$RUNNER_TEMP/windows" "$pid"; then found=true; break; fi
            sleep 2
          done
          screencapture -x "$RUNNER_TEMP/aidevbridge.png" || true
          # Still running a while after the window appeared?
          sleep 5
          kill -0 "$pid"
          kill -TERM "$pid"
          for attempt in $(seq 1 10); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then kill -KILL "$pid"; fi
          cat "$log"
          if [ "$found" != true ]; then
            echo "::error::aidevbridge started but showed no window"
            exit 1
          fi
      - name: Keep the screenshot and log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-start-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/aidevbridge.png
            ${{ runner.temp }}/aidevbridge.log
          if-no-files-found: ignore
      - name: Uninstall
        if: always()
        run: rm -rf "$APP" "$HOME/Library/Application Support/io.github.itbrain258.aidevbridge"

  windows-package:
    name: Build Windows packages
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true || (inputs.tag || '') != ''
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check the named tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The named tag must have the form v<major>.<minor>.<patch>"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.SOURCE_REF }}', persist-credentials: false }
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Tag and version agree
        if: env.PUBLISH_TAG != ''
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:PUBLISH_TAG -ne "v$version") { throw "Tag $env:PUBLISH_TAG does not match package.json version $version" }
      - name: Build and check MSI, setup EXE and ZIP
        run: npm run build:windows
      - name: Collect the packages
        shell: pwsh
        run: |
          $run = Get-ChildItem out/release-windows -Directory | Sort-Object Name | Select-Object -Last 1
          New-Item -ItemType Directory win | Out-Null
          Copy-Item "$($run.FullName)/artifacts/*" win/
          $manifest = Get-Content win/release-manifest.json -Raw | ConvertFrom-Json
          foreach ($item in $manifest.artifacts) {
            if ((Get-FileHash "win/$($item.path)" -Algorithm SHA256).Hash.ToLower() -ne $item.sha256) { throw "Hash mismatch: $($item.path)" }
            Add-Content $env:GITHUB_STEP_SUMMARY "``$($item.sha256)  $($item.path)``"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-packages
          path: win/
          if-no-files-found: error
      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-logs
          path: |
            out/release-windows/*/*.json
            out/release-windows/*/logs/
          if-no-files-found: ignore

  windows-install:
    name: Install and start on Windows
    needs: windows-package
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: windows-packages, path: win }
      - name: Install each package, start the app and remove it again
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content win/release-manifest.json -Raw | ConvertFrom-Json
          foreach ($item in $manifest.artifacts) {
            if ((Get-FileHash "win/$($item.path)" -Algorithm SHA256).Hash.ToLower() -ne $item.sha256) { throw "Hash mismatch: $($item.path)" }
          }
          $file = { param($kind) (Resolve-Path "win/$(($manifest.artifacts | Where-Object kind -eq $kind).path)").Path }
          function Test-Start([string]$exe, [string]$label) {
            if (-not (Test-Path $exe)) { throw "${label}: $exe is missing" }
            $process = Start-Process -FilePath $exe -PassThru
            $found = $false
            for ($i = 0; $i -lt 30 -and -not $found; $i++) {
              Start-Sleep -Seconds 2
              if ($process.HasExited) { throw "${label}: aidevbridge exited during start (exit $($process.ExitCode))" }
              $process.Refresh()
              $found = $process.MainWindowHandle -ne [IntPtr]::Zero
            }
            Start-Sleep -Seconds 5
            if ($process.HasExited) { throw "${label}: aidevbridge exited after its window appeared" }
            Stop-Process -Id $process.Id -Force
            $process.WaitForExit(20000) | Out-Null
            if (-not $found) { throw "${label}: aidevbridge started but showed no window" }
            Write-Host "${label}: started, window '$($process.MainWindowTitle)' found"
          }
          # MSI first: it takes its folder from the registry key the setup EXE
          # writes and its uninstaller leaves behind, and would otherwise
          # install below %LOCALAPPDATA% instead of %ProgramFiles%.
          $msi = & $file msi
          $install = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', "`"$env:RUNNER_TEMP\msi-install.log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install failed (exit $($install.ExitCode))" }
          Test-Start (Join-Path $env:ProgramFiles 'aidevbridge\aidevbridge.exe') 'MSI'
          $remove = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "MSI uninstall failed (exit $($remove.ExitCode))" }
          # Setup EXE: per user, below %LOCALAPPDATA%.
          $setup = Start-Process -FilePath (& $file nsis) -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "setup EXE failed (exit $($setup.ExitCode))" }
          $dir = Join-Path $env:LOCALAPPDATA 'aidevbridge'
          Test-Start (Join-Path $dir 'aidevbridge.exe') 'setup EXE'
          $uninstall = Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "setup EXE uninstall failed (exit $($uninstall.ExitCode))" }
          # ZIP: no installation.
          $zipDir = Join-Path $env:RUNNER_TEMP 'aidevbridge-zip'
          Expand-Archive -Path (& $file zip) -DestinationPath $zipDir
          if (-not (Test-Path (Join-Path $zipDir 'licenses/index.html'))) { throw 'ZIP: licenses/index.html is missing' }
          Test-Start (Join-Path $zipDir 'aidevbridge.exe') 'ZIP'
      - name: Keep the installer log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-install-log
          path: ${{ runner.temp }}/msi-install.log
          if-no-files-found: ignore

  publish:
    name: Publish with the release
    # Runs only when every build and installation test above has passed.
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.tag || '') != ''
    needs: [macos-package, macos-install, windows-package, windows-install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Only for the build provenance: id-token fetches the OIDC token for the
      # Sigstore certificate, attestations stores the attestation at GitHub.
      # No other job gets these permissions.
      id-token: write
      attestations: write
    steps:
      - name: Check the named tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The named tag must have the form v<major>.<minor>.<patch>"
            exit 1
          fi
      # The release-notes script of the workflow's own ref, also for a named tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: macos-dmg, path: mac }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: windows-packages, path: win }
      # A published file is never replaced. For each platform the plan
      # compares the files on the release (name and digest from the API, no
      # download) with the new build and stops on a conflict; otherwise it
      # lists the missing files, one per line.
      - name: Decide what the release still lacks
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/releases/tags/$PUBLISH_TAG" > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release.err"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qF '(HTTP 404)' "$RUNNER_TEMP/release.err"; then
            echo '{"assets": []}' > "$RUNNER_TEMP/release.json"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/release.err" >&2
            exit 1
          fi
          node scripts/release-attach.mjs --release "$RUNNER_TEMP/release.json" \
            --windows win/release-manifest.json --macos mac/release-manifest.json \
            --upload-list "$RUNNER_TEMP/upload.txt" --notes-args "$RUNNER_TEMP/notes-args.txt"
          {
            echo 'files<<UPLOAD_LIST_END'
            cat "$RUNNER_TEMP/upload.txt"
            echo 'UPLOAD_LIST_END'
          } >> "$GITHUB_OUTPUT"
          if [ ! -s "$RUNNER_TEMP/upload.txt" ]; then
            echo "Nothing to attach to $PUBLISH_TAG." >> "$GITHUB_STEP_SUMMARY"
          fi
          # A group the release has with exactly this build's bytes gets its
          # section written again, also when nothing is left to upload.
          if [ -s "$RUNNER_TEMP/notes-args.txt" ]; then
            echo "notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "notes=false" >> "$GITHUB_OUTPUT"
          fi
      # GitHub expressions compare strings without regard to case, so they
      # would take a run on refs/tags/V0.2.4 for one on the tag v0.2.4. The
      # decision is made here in bash, which compares exactly.
      - name: Check whether the run's ref is the tag to publish
        id: ref
        run: |
          if [[ "$GITHUB_REF" == "refs/tags/$PUBLISH_TAG" ]]; then
            echo "on_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_tag=false" >> "$GITHUB_OUTPUT"
          fi
      # The provenance records the run's ref and commit (github.ref,
      # github.sha), not those of the built tag. They agree only when the run
      # runs on the tag itself. A tag push builds github.sha, so the attested
      # commit is the built one even if the tag has moved since; a manual run
      # on the tag that also names it builds the tag by name. A manual run from
      # a branch that names the tag would attest the branch as the source. The
      # subjects are exactly the files of the upload list, so that only digests
      # this run intends to upload are attested; if the upload fails
      # afterwards, their attestation remains all the same.
      - name: Record the build provenance of the files to attach
        if: steps.plan.outputs.files != '' && steps.ref.outputs.on_tag == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.plan.outputs.files }}
      - name: Attach the packages the release still lacks, or create the release
        if: steps.plan.outputs.files != '' || steps.plan.outputs.notes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXISTS: ${{ steps.plan.outputs.exists }}
        run: |
          set -euo pipefail
          tag="$PUBLISH_TAG"
          version="${tag#v}"
          mapfile -t upload < "$RUNNER_TEMP/upload.txt"
          mapfile -t args < "$RUNNER_TEMP/notes-args.txt"
          # gh release upload replaces nothing here: if one of the files has
          # appeared on the release in the meantime, the upload stops.
          if [ "$EXISTS" = true ]; then
            node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).body ?? "")' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/body.md"
            node scripts/release-notes.mjs "$version" --body "$RUNNER_TEMP/body.md" "${args[@]}" > "$RUNNER_TEMP/notes.md"
            if [ "${#upload[@]}" -gt 0 ]; then
              gh release upload "$tag" "${upload[@]}"
            fi
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          else
            node scripts/release-notes.mjs "$version" "${args[@]}" > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" "${upload[@]}" --verify-tag --title "aidevbridge $version" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          printf 'Attached to %s:\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
          for f in "${upload[@]}"; do echo "- $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"; done
      # Runs after the upload, and also after a failed one, which may have
      # attached part of the files already: the warning appears whenever this
      # run put or tried to put files without provenance on the release.
      - name: Note the attached files without build provenance
        if: ${{ !cancelled() && steps.plan.outputs.files != '' && steps.ref.outputs.on_tag == 'false' }}
        run: |
          msg="The files this run attached or attempted to attach to $PUBLISH_TAG carry no build provenance, because the run's ref $GITHUB_REF is not refs/tags/$PUBLISH_TAG."
          echo "::warning::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
