name: Android
# Builds the Android app (docs/specs/2026-10-27-android-design.md §6).
# Every push to main and every pull request makes an unsigned preview APK for
# arm64 (never published). A tag v*, or a manual run naming a tag, builds the
# release for arm64, armv7 and x86_64, signs it in a job of its own, attaches
# the APK to the GitHub release of that tag and, once the Play secret exists,
# uploads the App Bundle to Google Play. A manual run with "release" builds
# the release the same way, signs and publishes nothing: the test before a
# tag.
#
# The build job has no secrets: it runs npm, the Gradle plugins and every
# build script and proc macro of the Rust tree. The signing key only reaches
# the sign job, which gets the finished files and runs nothing but the SDK's
# signing tools (SECURITY.md, the same rule as U2 for macOS).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release build of this branch (checks the bound license selection, builds APK and App Bundle for all three ABIs; signs and publishes nothing)
        type: boolean
        default: false
      tag:
        description: Build the existing tag v<version>, attach the APK to its release and upload to Google Play
        type: string
        default: ''
      play_track:
        description: Google Play track for the upload (variable = the repository variable PLAY_TRACK, else internal; alpha = closed testing, beta = open testing)
        type: choice
        options: [variable, internal, alpha, beta, production]
        default: variable
permissions:
  contents: read
concurrency:
  group: android-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.tag }}
env:
  SOURCE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
  PUBLISH_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
  # Release build: all three ABIs, App Bundle, bound license texts.
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true || (inputs.tag || '') != '' }}
  NDK_VERSION: 29.0.14206865
  BUILD_TOOLS: 36.0.0
  PACKAGE_NAME: io.github.itbrain258.aidevbridge
jobs:
  build:
    name: Build Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check the named tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The named tag must have the form v<major>.<minor>.<patch>"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.SOURCE_REF }}', persist-credentials: false }
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Tag and version agree
        if: env.PUBLISH_TAG != ''
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$PUBLISH_TAG" != "v$version" ]; then
            echo "::error::Tag $PUBLISH_TAG does not match package.json version $version"
            exit 1
          fi
      # Gradle 8.14 and the Android Gradle plugin 8.11 run on Java 17 to 21.
      - name: Android SDK, NDK and Java 21
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      # The third-party license texts travel in the APK as assets/licenses
      # (docs/specs/2026-10-27-android-design.md §8). A release takes them
      # from the bound selection, which refuses any changed input; a preview
      # carries a note instead, as the macOS preview does.
      - name: License texts for the APK
        run: |
          set -euo pipefail
          assets=src-tauri/gen/android/app/src/main/assets/licenses
          mkdir -p "$assets"
          if [ "$RELEASE" = true ]; then
            cargo fetch --locked
            node scripts/release-licenses.mjs prepare android-universal
            cp -R out/release-notices-android/. "$assets/"
          else
            printf 'aidevbridge preview build of commit %s.\n\nThis build is for testing and not for distribution. It does not carry the\nthird-party license texts; release builds do, in this folder.\n' "$GITHUB_SHA" > "$assets/README.txt"
          fi
      - name: Build
        run: |
          set -euo pipefail
          if [ "$RELEASE" = true ]; then
            npm run tauri -- android build --ci --apk --aab --target aarch64 armv7 x86_64
          else
            npm run tauri -- android build --ci --apk --target aarch64
          fi
      # Every prepared file must be in the APK and in the App Bundle (from
      # which Google Play builds what it delivers) with its bytes. Android's
      # packaging skips assets whose names start with a dot, which leaves out
      # only the helper's ownership marker.
      - name: Check the license texts in APK and App Bundle
        run: |
          set -euo pipefail
          outputs="$PWD/src-tauri/gen/android/app/build/outputs"
          apk="$outputs/apk/universal/release/app-universal-release-unsigned.apk"
          if [ "$RELEASE" != true ]; then
            unzip -p "$apk" assets/licenses/README.txt > /dev/null
            exit 0
          fi
          node scripts/release-licenses.mjs check android-universal
          cd out/release-notices-android
          check() {
            local archive="$1" prefix="$2" expected=0 actual
            while IFS= read -r -d '' file; do
              name="${file#./}"
              unzip -p "$archive" "$prefix$name" | cmp -s - "$name" || { echo "::error::$prefix$name in $(basename "$archive") differs or is missing"; exit 1; }
              expected=$((expected + 1))
            done < <(find . -type f ! -name '.*' -print0)
            actual=$(unzip -Z1 "$archive" | grep -c "^$prefix")
            [ "$actual" -eq "$expected" ] || { echo "::error::$(basename "$archive") has $actual license files, expected $expected"; exit 1; }
            echo "$(basename "$archive") carries the $expected files of the Android license selection" >> "$GITHUB_STEP_SUMMARY"
          }
          check "$apk" assets/licenses/
          check "$outputs/bundle/universalRelease/app-universal-release.aab" base/assets/licenses/
      # Google Play requires native libraries whose LOAD segments are aligned
      # to 16 KB pages (Android 15 and newer). zipalign -P 16 in the sign job
      # only places them in the zip; this checks the libraries themselves.
      - name: Check the 16 KB alignment of the native libraries
        run: |
          set -euo pipefail
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          readelf="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          libs="$RUNNER_TEMP/native-libs"
          rm -rf "$libs"
          unzip -q "$apk" 'lib/*' -d "$libs"
          count=0
          while IFS= read -r -d '' lib; do
            while read -r align; do
              if [ $((align)) -lt 16384 ]; then
                echo "::error::${lib#"$libs"/} has a LOAD segment aligned to $align; Google Play needs 16 KB"
                exit 1
              fi
            done < <("$readelf" -lW "$lib" | awk '$1 == "LOAD" { print $NF }')
            count=$((count + 1))
          done < <(find "$libs" -name '*.so' -print0)
          [ "$count" -gt 0 ] || { echo "::error::The APK has no native library"; exit 1; }
          echo "$count native libraries aligned to 16 KB pages" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect the unsigned files
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          out=src-tauri/gen/android/app/build/outputs
          mkdir -p unsigned
          cp "$out/apk/universal/release/app-universal-release-unsigned.apk" "unsigned/aidevbridge-$version-android-unsigned.apk"
          if [ "$RELEASE" = true ]; then
            cp "$out/bundle/universalRelease/app-universal-release.aab" "unsigned/aidevbridge-$version-android-unsigned.aab"
            cp "$out/mapping/universalRelease/mapping.txt" unsigned/mapping.txt
          fi
          ls -l unsigned >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: unsigned/
          if-no-files-found: error

  sign:
    name: Sign the release
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.tag || '') != ''
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The signing secrets live in this environment, not in the repository, so
    # that no other job can read them.
    environment: android-release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: android-unsigned, path: unsigned }
      # A download, so before and outside the step that holds the key.
      - name: Android build tools
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS" > /dev/null
      - name: Sign and verify APK and App Bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing in the environment android-release (scripts/android-github-secrets.ps1)"
              exit 1
            fi
          done
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          version="${PUBLISH_TAG#v}"
          apk="aidevbridge-$version-android.apk"
          aab="aidevbridge-$version-android.aab"
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          mkdir -p signed
          # Native libraries stay uncompressed and aligned to 16 KB pages,
          # which Google Play requires for Android 15 and newer.
          "$tools/zipalign" -P 16 -f 4 "unsigned/aidevbridge-$version-android-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "signed/$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose "signed/$apk" > /dev/null
          "$tools/zipalign" -c -P 16 4 "signed/$apk"
          cp "unsigned/aidevbridge-$version-android-unsigned.aab" "signed/$aab"
          "$JAVA_HOME_21_X64/bin/jarsigner" -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 \
            "signed/$aab" "$ANDROID_KEY_ALIAS" > /dev/null
          # Without -strict: it turns the warning about a self-signed
          # certificate into exit 4, and every upload key is self-signed.
          verified=$("$JAVA_HOME_21_X64/bin/jarsigner" -verify "signed/$aab")
          grep -qx 'jar verified.' <<< "$verified" || { echo "::error::jarsigner could not verify the App Bundle"; echo "$verified"; exit 1; }
          cp unsigned/mapping.txt signed/mapping.txt
          certificate=$("$tools/apksigner" verify --print-certs "signed/$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          sha256=$(sha256sum "signed/$apk" | cut -d' ' -f1)
          node -e '
            const [version, apk, sha256, certificate] = process.argv.slice(1);
            const manifest = { status: "signed_and_verified", contract: { version, certificate }, artifacts: [{ kind: "apk", path: apk, sha256 }] };
            require("fs").writeFileSync("signed/android-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          ' "$version" "$apk" "$sha256" "$certificate"
          {
            echo "Signed with certificate SHA-256 $certificate"
            echo
            echo "    $sha256  $apk"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-signed
          path: signed/
          if-no-files-found: error

  publish:
    name: Attach the APK to the release
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # packages.yml reads and writes the same release text; one job at a time
    # per tag, so that neither drops the other's section.
    concurrency:
      group: release-text-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      # Only for the build provenance, as in packages.yml.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.SOURCE_REF }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: android-signed, path: signed }
      # A published file is never replaced: the same name with the same digest
      # is already done, a different digest stops the run.
      - name: Decide whether the release still lacks the APK
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk="aidevbridge-${PUBLISH_TAG#v}-android.apk"
          if gh api "repos/$GH_REPO/releases/tags/$PUBLISH_TAG" > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release.err"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qF '(HTTP 404)' "$RUNNER_TEMP/release.err"; then
            echo '{"assets": []}' > "$RUNNER_TEMP/release.json"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/release.err" >&2
            exit 1
          fi
          local_digest="sha256:$(sha256sum "signed/$apk" | cut -d' ' -f1)"
          remote_digest=$(jq -r --arg name "$apk" '.assets[] | select(.name == $name) | .digest // "unknown"' "$RUNNER_TEMP/release.json")
          if [ -z "$remote_digest" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          elif [ "$remote_digest" = "$local_digest" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$apk is already on the release with other bytes ($remote_digest); a published file is never replaced"
            exit 1
          fi
      - name: Check whether the run's ref is the tag to publish
        id: ref
        run: |
          if [[ "$GITHUB_REF" == "refs/tags/$PUBLISH_TAG" ]]; then
            echo "on_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_tag=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Record the build provenance of APK and App Bundle
        if: steps.plan.outputs.upload == 'true' && steps.ref.outputs.on_tag == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            signed/aidevbridge-*-android.apk
            signed/aidevbridge-*-android.aab
      # The Android part of the release text sits between its own markers;
      # packages.yml keeps it when it writes the Windows and macOS parts.
      - name: Attach the APK, or create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXISTS: ${{ steps.plan.outputs.exists }}
          UPLOAD: ${{ steps.plan.outputs.upload }}
        run: |
          set -euo pipefail
          tag="$PUBLISH_TAG"
          version="${tag#v}"
          apk="signed/aidevbridge-$version-android.apk"
          if [ "$EXISTS" = true ]; then
            jq -r '.body // ""' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/body.md"
            node scripts/release-notes.mjs "$version" --body "$RUNNER_TEMP/body.md" --android signed/android-manifest.json > "$RUNNER_TEMP/notes.md"
            if [ "$UPLOAD" = true ]; then gh release upload "$tag" "$apk"; fi
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          else
            node scripts/release-notes.mjs "$version" --android signed/android-manifest.json > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" "$apk" --verify-tag --title "aidevbridge $version" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "Attached $(basename "$apk") to $tag" >> "$GITHUB_STEP_SUMMARY"

  play:
    name: Upload to Google Play
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: android-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.SOURCE_REF }}', persist-credentials: false }
      - name: Check for the Play service account
        id: check
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "No PLAY_SERVICE_ACCOUNT_JSON in android-release: the App Bundle stays an artifact of this run (docs/android-veroeffentlichung.md)." >> "$GITHUB_STEP_SUMMARY"
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.check.outputs.upload == 'true'
        with: { name: android-signed, path: signed }
      # "What's new" per language from the store texts in fastlane/metadata:
      # changelogs/<versionCode>.txt, else changelogs/default.txt. versionCode
      # as Tauri derives it from the version (major * 1000000 + minor * 1000 +
      # patch).
      - name: Release notes for the store
        if: steps.check.outputs.upload == 'true'
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<< "${PUBLISH_TAG#v}"
          code=$((major * 1000000 + minor * 1000 + patch))
          mkdir -p whatsnew
          for dir in fastlane/metadata/android/*/; do
            locale=$(basename "$dir")
            for file in "$dir/changelogs/$code.txt" "$dir/changelogs/default.txt"; do
              if [ -f "$file" ]; then cp "$file" "whatsnew/whatsnew-$locale"; break; fi
            done
          done
          echo "versionCode $code, notes: $(ls whatsnew | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        if: steps.check.outputs.upload == 'true'
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: signed/aidevbridge-*-android.aab
          releaseName: ${{ env.PUBLISH_TAG }}
          track: ${{ (inputs.play_track && inputs.play_track != 'variable') && inputs.play_track || vars.PLAY_TRACK || 'internal' }}
          # "draft" until the app has passed its first review; then "completed".
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: whatsnew
          mappingFile: signed/mapping.txt
