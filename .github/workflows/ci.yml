name: CI
# Every pull request and every push to main. A branch is checked through its
# pull request only, so each commit runs once instead of twice; a newer commit
# of the same pull request cancels the run of the older one. Tags need no run
# of their own: a tag points at a commit on main that was checked when it was
# pushed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Runner images are pinned (not *-latest), so that an image change on
# GitHub's side never changes a build unnoticed; a newer image comes with a
# pull request. The job names don't name the image, so that the ruleset of
# main keeps its required checks across such a change.
jobs:
  rust:
    name: rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-2025 }
          - { name: ubuntu, os: ubuntu-24.04 }
          - { name: macos, os: macos-26 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          components: clippy, rustfmt
      - name: Install Linux dependencies for Tauri
        if: matrix.name == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf openssh-server tmux
      # The live tests (CONTRIBUTING.md) run against an SSH server on the
      # runner itself, with a key made for this run and a tmux socket of its
      # own; the other runners skip them.
      - name: Local SSH test host for the live tests
        if: matrix.name == 'ubuntu'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          # The tests open many sessions at once.
          printf '%s\n' 'MaxStartups 100' 'MaxSessions 100' | sudo tee /etc/ssh/sshd_config.d/aidevbridge-ci.conf > /dev/null
          sudo systemctl restart ssh
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new 127.0.0.1 'tmux -V'
          {
            echo "AIDEVBRIDGE_TEST_HOST=127.0.0.1"
            echo "AIDEVBRIDGE_TEST_USER=$(id -un)"
            echo "AIDEVBRIDGE_TEST_HOST_KEY=$(cut -d' ' -f2 /etc/ssh/ssh_host_ed25519_key.pub)"
            echo "AIDEVBRIDGE_TEST_SOCKET=abtest_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      # Four threads, as CONTRIBUTING.md asks for the live tests: the key
      # preparation admits eight jobs per test process.
      - run: cargo test --locked --all --no-fail-fast -- --test-threads=4
        working-directory: src-tauri
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  # A dependency change needs its license review in the pull request that
  # makes it; own sources are rebound before a release. So this job fails on
  # third-party drift of the three license selections only, reports own
  # drift, and runs prepare and check for every platform once nothing has
  # drifted (docs/lizenzen-pflegen.md).
  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm ci
      - run: cargo fetch --locked
      - run: node scripts/release-license-status.mjs --ci
  scripts:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run test:scripts
