<!doctype html>
<!-- Quelle der Feature-Grafik fuer Google Play (1024 x 500). Gerendert mit
     scripts/android-store-graphics.ps1 (Edge headless). Farben aus dem
     Standardthema (src/styles.css). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: #15171C;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: #EDEFF3;
    display: flex; align-items: center; gap: 56px; padding: 0 72px; box-sizing: border-box;
  }
  .mark { flex: 0 0 auto; width: 200px; height: 200px; }
  .text { display: flex; flex-direction: column; gap: 18px; }
  h1 { margin: 0; font-size: 64px; line-height: 1; font-weight: 600; letter-spacing: -0.5px; }
  p { margin: 0; font-size: 28px; line-height: 1.3; color: #C9D0DA; max-width: 600px; }
  .pills { display: flex; gap: 12px; margin-top: 8px; }
  /* Wie die Statusanzeige der App (Spec vom 14.11.2026): getoent ist nur
     "Waiting"; "Busy" und "Idle" stehen neutral, ihr Zeichen traegt die Farbe. */
  .pill { display: inline-flex; align-items: center; gap: 10px; font-size: 20px; line-height: 1; padding: 9px 16px 9px 14px; border-radius: 999px; font-weight: 600; }
  .pill i { display: block; box-sizing: border-box; flex: none; }
  .waiting { background: rgba(251, 191, 36, 0.15); color: #FBBF24; }
  .waiting i { width: 11px; height: 11px; border-radius: 1px; background: #FBBF24; transform: rotate(45deg); }
  .busy, .idle { background: rgba(255, 255, 255, 0.07); color: #C9D0DA; }
  .busy i { width: 4px; height: 4px; margin: 0 6px; border-radius: 50%; background: #93C5FD; box-shadow: -6px 0 0 #93C5FD, 6px 0 0 #93C5FD; }
  .idle { font-weight: 400; }
  .idle i { width: 11px; height: 11px; border: 2px solid #939CAA; border-radius: 1px; transform: rotate(45deg); }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true">
    <rect width="1024" height="1024" rx="307" ry="307" fill="#2DD4BF"/>
    <g fill="none" stroke="#0F172A" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="341,363 469,491 341,619"/>
      <line x1="512" y1="661" x2="683" y2="661"/>
    </g>
  </svg>
  <div class="text">
    <h1>aidevbridge</h1>
    <p>Your coding agents in tmux, on your own Linux hosts, over SSH.</p>
    <div class="pills">
      <span class="pill waiting"><i></i>Waiting</span>
      <span class="pill busy"><i></i>Busy</span>
      <span class="pill idle"><i></i>Idle</span>
    </div>
  </div>
</body>
</html>
