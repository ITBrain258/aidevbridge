<!doctype html>
<!-- Quelle der Feature-Grafik fuer Google Play (1024 x 500). Gerendert mit
     scripts/android-store-graphics.ps1 (Edge headless). Farben aus dem
     Standardthema (src/styles.css). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: #15171C;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: #EDEFF3;
    display: flex; align-items: center; gap: 44px; padding: 0 48px; box-sizing: border-box;
  }
  .mark { flex: 0 0 auto; width: 400px; height: 400px; }
  .text { display: flex; flex-direction: column; gap: 18px; }
  h1 { margin: 0; font-size: 56px; line-height: 1; font-weight: 600; letter-spacing: -0.5px; }
  p { margin: 0; font-size: 26px; line-height: 1.3; color: #C9D0DA; max-width: 490px; }
  .pills { display: flex; gap: 12px; margin-top: 8px; }
  .pill { font-size: 20px; line-height: 1; padding: 9px 16px; border-radius: 999px; font-weight: 600; }
  .waiting { background: rgba(251, 191, 36, 0.15); color: #FBBF24; }
  .busy { background: rgba(74, 222, 128, 0.15); color: #4ADE80; }
  .idle { background: rgba(147, 197, 253, 0.15); color: #93C5FD; }
</style>
</head>
<body>
  <img class="mark" src="../../src-tauri/icons/source.png" alt="">
  <div class="text">
    <h1>aidevbridge</h1>
    <p>Your coding agents in tmux, on your own Linux hosts, over SSH.</p>
    <div class="pills">
      <span class="pill waiting">Waiting</span>
      <span class="pill busy">Busy</span>
      <span class="pill idle">Idle</span>
    </div>
  </div>
</body>
</html>
