<!doctype html>
<!-- Store-Icon fuer Google Play (512 x 512), aus dem Logo. Play verlangt eine
     randlose, deckende Flaeche und rundet die Ecken selbst ab. Der Grund ist
     ab-bg-canvas aus src/styles.css. Gerendert mit
     scripts/android-store-graphics.ps1 (Edge headless). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: #15171C; }
  img { display: block; width: 472px; height: 472px; margin: 20px; }
</style>
</head>
<body>
  <img src="../../src-tauri/icons/source.png" alt="">
</body>
</html>
